services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure_env.py or configure_env.ps1 before Docker Compose}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      # Persistent database files deliberately live outside the application code.
      # Future app updates can replace backend/frontend without touching this folder.
      - ./database/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    # The server .env also contains broker bootstrap settings; never pass its admin secret to the app.
    environment:
      MQTT_DYNSEC_PASSWORD: ""
    volumes:
      - ./database/imports:/app/uploads
      - ./database/backups:/app/backups
      - ./database/attachments:/app/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  mqtt-provision:
    profiles: ["mqtt-setup"]
    build: ./backend
    env_file: .env
    environment:
      MQTT_HOST: mqtt
      MQTT_INTERNAL_PORT: 1883
    volumes:
      - ./mqtt/provision_dynsec.py:/app/provision_dynsec.py:ro
    entrypoint: ["python", "/app/provision_dynsec.py"]
    depends_on:
      mqtt:
        condition: service_started
    restart: "no"

  mqtt:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: productionreviewwebapp-mqtt
    environment:
      MOSQUITTO_DYNSEC_PASSWORD: ${MQTT_DYNSEC_PASSWORD:?Set a strong MQTT_DYNSEC_PASSWORD in .env before starting the broker}
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/certs:/mosquitto/certs:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    ports:
      # Only the TLS listener is published. Port 1883 remains Docker-network-only.
      - "${MQTT_BIND:-0.0.0.0}:${MQTT_PORT:-8883}:8883"
    expose:
      - "1883"
    restart: unless-stopped

volumes:
  mqtt_data:
  mqtt_log:
