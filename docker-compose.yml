services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent database files deliberately live outside the application code.
      # Future app updates can replace backend/frontend without touching this folder.
      - ./database/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./database/imports:/app/uploads
      - ./database/backups:/app/backups
      - ./database/attachments:/app/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped
