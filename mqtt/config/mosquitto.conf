# ProductionReviewWebApp AFMS MQTT broker
# Port 1883 is for trusted Docker-network clients only (not published on the host).
# Port 8883 is the externally reachable TLS listener.
per_listener_settings false
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
autosave_interval 180
log_dest stdout
connection_messages true

plugin_load dynsec /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

listener 1883
protocol mqtt

listener 8883
protocol mqtt
certfile /mosquitto/certs/tls.crt
keyfile /mosquitto/certs/tls.key
tls_version tlsv1.2
