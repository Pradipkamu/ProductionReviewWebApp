name: Regenerate frontend lockfile

on:
  push:
    branches:
      - feature/manufacturing-intelligence-roadmap
    paths:
      - frontend/package.json
      - .github/workflows/regenerate-frontend-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manufacturing-intelligence-roadmap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package lock with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Verify production build
        run: npm run build
        working-directory: frontend
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
        working-directory: frontend
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): regenerate lockfile for Vite 8.3.5"
          git push origin HEAD:feature/manufacturing-intelligence-roadmap
