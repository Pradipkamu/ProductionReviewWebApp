name: Package v0.5.5 security phase 2
on:
  push:
    branches: [package-v055-security-phase2]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write update notes
        shell: bash
        run: |
          printf '%s\n'             'ProductionReviewWebApp v0.5.5 - Security & Governance Phase 2'             ''             'GitHub main commit: ca943055355ffddf526f56fec7bd0083578e4591'             'Database migration: none; schema head remains 0010_security_sessions.'             'Oracle HTTP remains supported; HTTPS is not forced.'             ''             'Install with auto_update_from_zip_windows.ps1, then press Ctrl+F5.'             'For legacy pms database passwords, update first, verify health, then run rotate_database_password_windows.ps1.'             > UPDATE_README.txt
      - name: Build changed-files ZIP
        run: >
          zip -r ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip
          .env.example
          README.md
          VERSION.txt
          UPDATE_README.txt
          backend/app/__init__.py
          backend/app/api/actions.py
          backend/app/api/diagnostics.py
          backend/app/api/import_preview.py
          backend/app/config.py
          backend/app/services/file_security.py
          backend/tests/test_diagnostics.py
          backend/tests/test_file_security.py
          backend/tests/test_whywhy_actions.py
          backup_database_linux.sh
          backup_database_windows.bat
          backup_database_windows.ps1
          configure_env.ps1
          configure_env.py
          docker-compose.yml
          docs/SECURITY_GOVERNANCE.md
          docs/SECURITY_PHASE2_v0.5.5.md
          frontend/package-lock.json
          frontend/package.json
          frontend/src/pages/Diagnostics.tsx
          rotate_database_password_linux.sh
          rotate_database_password_windows.bat
          rotate_database_password_windows.ps1
          verify_backup_restore_linux.sh
          verify_backup_restore_windows.ps1
      - name: Validate ZIP
        run: |
          unzip -t ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip
          sha256sum ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip > ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip.sha256
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2
          path: |
            ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip
            ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip.sha256
          if-no-files-found: error
