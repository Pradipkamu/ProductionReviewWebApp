name: Package v0.5.5 security phase 2
on:
  push:
    branches: [package-v055-security-phase2]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build changed-files update ZIP
        shell: bash
        run: |
          set -euo pipefail
          PKG="ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2"
          mkdir -p "$PKG"
          files=(
            ".env.example"
            "README.md"
            "VERSION.txt"
            "backend/app/__init__.py"
            "backend/app/api/actions.py"
            "backend/app/api/diagnostics.py"
            "backend/app/api/import_preview.py"
            "backend/app/config.py"
            "backend/app/services/file_security.py"
            "backend/tests/test_diagnostics.py"
            "backend/tests/test_file_security.py"
            "backend/tests/test_whywhy_actions.py"
            "backup_database_linux.sh"
            "backup_database_windows.bat"
            "backup_database_windows.ps1"
            "configure_env.ps1"
            "configure_env.py"
            "docker-compose.yml"
            "docs/SECURITY_GOVERNANCE.md"
            "docs/SECURITY_PHASE2_v0.5.5.md"
            "frontend/package-lock.json"
            "frontend/package.json"
            "frontend/src/pages/Diagnostics.tsx"
            "rotate_database_password_linux.sh"
            "rotate_database_password_windows.bat"
            "rotate_database_password_windows.ps1"
            "verify_backup_restore_linux.sh"
            "verify_backup_restore_windows.ps1"
          )
          for f in "${files[@]}"; do
            mkdir -p "$PKG/$(dirname "$f")"
            cp "$f" "$PKG/$f"
          done
          cat > "$PKG/UPDATE_README.txt" <<'EOF'
ProductionReviewWebApp v0.5.5 - Security & Governance Phase 2

GitHub main commit:
ca943055355ffddf526f56fec7bd0083578e4591

Database migration:
None. Existing schema head 0010_security_sessions is unchanged.

Oracle HTTPS:
HTTPS is NOT forced. Keep REQUIRE_HTTPS=false and TRUST_PROXY_HEADERS=false
until HTTPS is confirmed working.

Main changes:
- Secure Excel/Office upload validation
- Action evidence attachment allow-list, signature validation and path containment
- Strong credentials for fresh installations
- Safe PostgreSQL password rotation scripts
- Custom-format database backups with SHA-256
- Isolated restore verification evidence
- Expanded System Diagnostics security/backup/upload status

Install:
cd "D:\Machine Shop MIS"
.\auto_update_from_zip_windows.ps1 "D:\Downloads\ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip"

After update, press Ctrl+F5.

For an existing installation with the legacy pms database password, do NOT edit
DATABASE_URL manually. After the application update is healthy, use:
.\rotate_database_password_windows.ps1
EOF
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          pkg=Path("ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2")
          rows=[]
          for p in sorted(pkg.rglob("*")):
              if p.is_file():
                  rows.append({
                      "path":p.relative_to(pkg).as_posix(),
                      "size":p.stat().st_size,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  })
          manifest={
              "package":pkg.name,
              "repository":"Pradipkamu/ProductionReviewWebApp",
              "commit":"ca943055355ffddf526f56fec7bd0083578e4591",
              "version":"v0.5.5",
              "database_migration_required":False,
              "changed_repository_files":28,
              "files":rows,
          }
          (pkg/"MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          PY
          zip -qr "$PKG.zip" "$PKG"
          unzip -t "$PKG.zip"
          sha256sum "$PKG.zip" > "$PKG.zip.sha256"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2
          path: |
            ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip
            ProductionReviewWebApp_Update_v0.5.5_SecurityPhase2.zip.sha256
          if-no-files-found: error
